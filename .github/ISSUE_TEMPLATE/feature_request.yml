name: 功能建议
description: 提议新的归档能力、站点兼容或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下需要这项能力？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的操作流程和输出结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 示例中不包含账号、Cookie、内部地址或未授权材料
          required: true
